<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Mode Luxury Squircle Background Gradient -->
    <radialGradient id="pwa-dark-bg-grad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#24121A"/>
      <stop offset="60%" stop-color="#180D12"/>
      <stop offset="100%" stop-color="#12080D"/>
    </radialGradient>

    <!-- Dark Mode Warm White + Soft Ivory Shadow Left Ribbon -->
    <linearGradient id="pwa-dark-left-fill" x1="91" y1="46" x2="121" y2="323" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="49%" stop-color="#FFF8ED"/>
      <stop offset="100%" stop-color="#EADBCE"/>
    </linearGradient>

    <!-- Dark Mode Warm White + Soft Ivory Center Fold Ribbon -->
    <linearGradient id="pwa-dark-center-fill" x1="290" y1="105" x2="183" y2="276" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF8ED"/>
      <stop offset="52%" stop-color="#F2E6D8"/>
      <stop offset="100%" stop-color="#DFCEBE"/>
    </linearGradient>

    <!-- Dark Mode Preserved Royal Gold Upper Accent -->
    <linearGradient id="pwa-dark-gold-upper" x1="291" y1="27" x2="243" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D6A13B"/>
      <stop offset="50%" stop-color="#C7892E"/>
      <stop offset="100%" stop-color="#C1621A"/>
    </linearGradient>

    <!-- Dark Mode Preserved Royal Gold Lower Accent -->
    <linearGradient id="pwa-dark-gold-lower" x1="190" y1="214" x2="195" y2="283" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D6A13B"/>
      <stop offset="50%" stop-color="#C7892E"/>
      <stop offset="100%" stop-color="#C1621A"/>
    </linearGradient>

    <filter id="pwa-dark-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#D6A13B" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Luxury Dark Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#pwa-dark-bg-grad)"/>
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="rgba(232, 153, 130, 0.32)" stroke-width="2.5"/>
  <rect width="476" height="476" x="18" y="18" rx="98" fill="none" stroke="rgba(214, 161, 59, 0.25)" stroke-width="1.5"/>

  <!-- Master Emblem in Dark Mode (Warm White Body + Soft Ivory Shadow + Royal Gold Accents) -->
  <g transform="translate(256, 256) scale(1.08)" filter="url(#pwa-dark-shadow)">
    <g transform="translate(-174.735, -175.025)">
      <!-- Left Ribbon (Warm White Body & Soft Ivory Shadow) -->
      <path fill="url(#pwa-dark-left-fill)" d="M 58.05,46.45 L 147.48,97.94 C 162.85,106.75 170.78,120.15 170.78,135.43 L 170.78,322.16 L 75.14,267.86 C 64.14,261.61 58.05,252.95 58.05,240.17 Z"/>
      
      <!-- Center Ribbon (Soft Balanced Fold Transitions) -->
      <path fill="url(#pwa-dark-center-fill)" d="M 290.75,104.54 L 199.54,166.45 C 191.19,172.12 186.69,176.00 186.69,183.09 C 186.69,190.18 191.61,195.98 199.66,200.23 L 246.45,224.91 C 257.11,230.52 261.78,238.05 261.78,246.31 C 261.78,254.48 258.67,261.18 249.36,267.17 L 192.14,303.51 C 188.45,305.85 186.74,308.03 186.74,311.14 L 186.74,323.27 L 275.19,269.26 C 285.43,263.01 290.75,254.51 290.75,241.91 Z"/>
      
      <!-- Gold Upper Accent -->
      <path fill="url(#pwa-dark-gold-upper)" d="M 291.42,26.78 L 210.28,81.46 C 196.41,90.76 188.85,101.12 188.85,116.95 L 188.85,152.66 L 278.07,92.10 C 287.35,85.81 291.42,77.74 291.42,66.92 Z"/>
      
      <!-- Gold Lower Accent -->
      <path fill="url(#pwa-dark-gold-lower)" d="M 189.52,214.14 L 230.66,235.55 C 235.16,237.89 237.36,240.63 237.36,245.66 C 237.36,250.43 235.55,253.07 231.10,255.96 L 189.52,283.43 Z"/>
    </g>
  </g>
</svg>
